repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: pyrefly
        name: Pyrefly check
        entry: uv run --locked pyrefly check app tests
        language: system
        pass_filenames: false
        types: [python]
